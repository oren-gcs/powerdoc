apiVersion: v1
kind: Namespace
metadata:
  name: docflow
---
apiVersion: v1
kind: Secret
metadata:
  name: docflow
  namespace: docflow
stringData:
  secret-key: change-me
  database-url: postgresql+psycopg://docflow:docflow@postgres:5432/docflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: docflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: docflow/api:latest
          ports: [{ containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: docflow, key: database-url } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: docflow, key: secret-key } }
            - name: CLOUD_PROVIDER
              value: kubernetes
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: docflow
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: docflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: docflow/web:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: docflow
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docflow
  namespace: docflow
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
