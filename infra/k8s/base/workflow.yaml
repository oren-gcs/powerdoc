apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  labels:
    app.kubernetes.io/name: workflow
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docflow/api:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000

          env:
            - name: DOCFLOW_SERVICE
              value: "workflow"
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: ENVIRONMENT }
            - name: CLOUD_PROVIDER
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: CLOUD_PROVIDER }
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: CORS_ORIGINS }
            - name: SEED_DEMO
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: SEED_DEMO }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: DATABASE_URL }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: SECRET_KEY }
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: SMTP_HOST }
            - name: SMTP_USER
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: SMTP_USER }
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: SMTP_PASSWORD }
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: SMTP_FROM }
            - name: IDENTITY_URL
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: IDENTITY_URL }
            - name: DOCUMENTS_URL
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: DOCUMENTS_URL }
            - name: FORMS_URL
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: FORMS_URL }
            - name: WORKFLOW_URL
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: WORKFLOW_URL }
            - name: NOTIFY_URL
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: NOTIFY_URL }
            - name: ANALYTICS_URL
              valueFrom:
                configMapKeyRef: { name: docflow-config, key: ANALYTICS_URL }
            - name: STORAGE_PATH
              value: /data/storage

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 1000
            runAsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: workflow
  labels:
    app.kubernetes.io/name: workflow
spec:
  selector:
    app.kubernetes.io/name: workflow
  ports:
    - name: http
      port: 8000
      targetPort: http
