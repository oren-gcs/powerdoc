apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: docflow

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - pvc-storage.yaml
  - identity.yaml
  - documents.yaml
  - forms.yaml
  - workflow.yaml
  - notify.yaml
  - analytics.yaml
  - gateway.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/part-of: docflow
  app.kubernetes.io/version: "2.0.0"

images:
  - name: docflow/api
    newTag: "2.0.0"
  - name: docflow/web
    newTag: "2.0.0"
